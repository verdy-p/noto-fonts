# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
name: 'Teraform Security'

on:
  push:
    branches: [ 'main' ]
  pull_request:
    branches: [ 'main' ]
  schedule:
    - cron: '20 14 * * 1'

permissions:
  contents: read

jobs:
  tfsec:
    name: 'Run Teraform Security SARIF report'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: audit

      - name: 'Checkout repository'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 'Run Teraform Security check'
        uses: aquasecurity/tfsec-sarif-action@21ded20e8ca120cd9d3d6ab04ef746477542a608
        with:
          # Path to SARIF file relative to the root of the repository
          sarif_file: tfsec.sarif

      # Upload the results as artifacts (optional). Commenting out will disable uploads of run results in SARIF
      # format to the repository Actions tab.
      - name: 'Upload the results SARIF file as artifacts to the repository Actions tab'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          # Path to SARIF file relative to the root of the repository
          path: tfsec.sarif
          retention-days: 5

      # Upload the results SARIF file to the repository Code scanning dashboard.
      - name: 'Upload the results SARIF file to the repository Code scanning dashboard'
        uses: github/codeql-action/upload-sarif@b1bff81932f5cdfc8695c7752dcee935dcd061c8 # v4.33.0
        with:
          # Path to SARIF file relative to the root of the repository
          sarif_file: tfsec.sarif
